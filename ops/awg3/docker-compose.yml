name: lxbox-awg3-stand

services:
  awg:
    image: amneziavpn/amneziawg-go@sha256:cbafc02b8373a83f428272db6d8001b37bc02e6211cbd8c0cb4e2e3759b12b72
    command:
      - /bin/bash
      - -ec
      - |
        set -euo pipefail
        mkdir -p /etc/amneziawg
        amneziawg-go -f wg0 &
        pid=$$!
        trap 'kill "$$pid" 2>/dev/null || true; wait "$$pid" || true' TERM INT EXIT
        ready=0
        for _ in $$(seq 1 100); do
          if awg show wg0 >/dev/null 2>&1; then
            ready=1
            break
          fi
          kill -0 "$$pid"
          sleep 0.2
        done
        [ "$$ready" = 1 ]
        umask 077
        awk '!/^(Address|MTU|DNS)[[:space:]]*=/' /etc/amneziawg/wg0.conf > /tmp/wg0.awg.conf
        mtu=$$(awk -F= '$$1 ~ /^MTU[[:space:]]*$$/ { gsub(/[[:space:]]/, "", $$2); print $$2; exit }' /etc/amneziawg/wg0.conf)
        awg setconf wg0 /tmp/wg0.awg.conf
        rm -f /tmp/wg0.awg.conf
        ip addr add 10.8.3.1/24 dev wg0
        ip link set dev wg0 mtu "$$mtu" up
        wait "$$pid"
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "ip -4 addr show dev wg0 | grep -q 'inet 10.8.3.1/24'"]
      interval: 1s
      timeout: 2s
      retries: 50
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:51820:51820/udp"
    volumes:
      - ${AWG3_RUNTIME_DIR:-../../app/build/awg3-stand}/server.conf:/etc/amneziawg/wg0.conf:ro

  echo:
    image: hashicorp/http-echo@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
    command: ["-listen=10.8.3.1:8080", "-text=awg3-ok"]
    network_mode: service:awg
    depends_on:
      awg:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
